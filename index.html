<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hoop.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04080F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HoopConnect" />
    <title>HoopConnect</title>
    <!-- First-paint splash: paints on HTML arrival so FCP is not gated behind the
         JS/i18n/font chain. React clears #root on mount, removing it automatically. -->
    <style>
      #hc-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(ellipse 90% 55% at 62% -8%,rgba(91,184,245,.20) 0%,transparent 58%),
        radial-gradient(ellipse 100% 60% at 50% 112%,rgba(30,90,180,.18) 0%,transparent 50%),
        linear-gradient(170deg,#0C1F38 0%,#091828 42%,#060F1E 100%);}
      @keyframes hc-pulse{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1)}}
    </style>
    <!-- DNS preconnect for Google Fonts — eliminates extra RTT on cold load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts as a direct <link> instead of a CSS @import: the @import was a
         render-blocking 3-hop waterfall (html → app CSS → fonts CSS → woff2). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@300;400;500;600&family=Manrope:wght@500;600;700;800&display=swap" />
    <!-- Umami analytics — defer, zero render impact, auto-tracks SPA routes -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a7d4cc36-01ca-4b44-b767-133919650fcb"></script>
  </head>
  <body>
    <div id="root">
      <div id="hc-splash">
        <svg width="76" height="76" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg"
          style="animation:hc-pulse 1.3s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(40,120,220,.45))">
          <defs>
            <linearGradient id="hcd" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#C8ECFF"/><stop offset="35%" stop-color="#5BB8F5"/>
              <stop offset="70%" stop-color="#2272C3"/><stop offset="100%" stop-color="#0D4A8A"/>
            </linearGradient>
          </defs>
          <polygon points="45,6 82,32 82,58 45,84 8,58 8,32" fill="url(#hcd)"/>
          <polygon points="45,6 8,32 45,42" fill="rgba(255,255,255,0.5)"/>
          <polygon points="45,6 82,32 45,42" fill="rgba(255,255,255,0.2)"/>
          <polygon points="45,6 82,32 82,58 45,84 8,58 8,32" fill="none"
            stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
